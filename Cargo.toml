[package]
name = "geommesh"
version = "0.1.0"
edition = "2021"
description = "Geometry construction and meshing via Gmsh's C API"
license = "MIT OR Apache-2.0"
repository = "https://github.com/MEMAndersen/geommesh"
readme = "README.md"
keywords = ["geometry", "mesh", "meshing", "gmsh", "FEA", "FEM"]
categories = ["science"]
exclude = ["/.cargo", "/.plans", "/.sandbox", "/xtask"]

[dependencies]
libloading = "0.8"

[[bin]]
name = "prototype"
path = "src/bin/prototype.rs"

[[bin]]
name = "phase2_test"
path = "src/bin/phase2_test.rs"

[[bin]]
name = "deep_beam_test"
path = "src/bin/deep_beam_test.rs"

[workspace]
members = ["xtask"]
